{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/404.css') }}">
{% endblock %}

{% block content %}
<div class="container">
	<h1>404</h1>
	<p>Oops! The page you're looking for doesn't exist.</p>
	<p><a href="{{ url_for('index') }}">Go back to the homepage</a></p>
</div>
{% endblock %}
